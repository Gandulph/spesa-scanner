<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Scontrino — Spesa Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --paper: #F1EFE4;
    --paper-dark: #E6E2D2;
    --ink: #1F2A24;
    --ink-soft: #5B6157;
    --scan: #D8441C;
    --scan-soft: #F0C9BA;
    --grocery: #4C6B54;
    --dotted: #B7B09A;
    --white: #FDFCF7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper-dark);
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    color: var(--ink);
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 20px 12px 60px;
  }
  @font-face{
    font-family:'IBM Plex Mono';
    src: local('IBM Plex Mono');
  }
  .app{
    width:100%;
    max-width: 440px;
  }
  .brandbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding: 0 4px 14px;
  }
  .brandbar .mark{
    font-weight:700;
    font-size:13px;
    letter-spacing:0.14em;
    color: var(--ink-soft);
  }
  .brandbar .mark b{ color: var(--scan); }
  .brandbar .count{
    font-size:12px;
    color: var(--ink-soft);
    letter-spacing:0.05em;
  }
  /* Receipt */
  .receipt{
    background: var(--paper);
    box-shadow: 0 2px 0 rgba(31,42,36,0.04), 0 18px 40px -22px rgba(31,42,36,0.45);
    padding: 26px 22px 30px;
    position:relative;
  }
  .receipt::before{
    content:"";
    position:absolute; left:0; right:0; top:-10px; height:10px;
    background-image: radial-gradient(circle at 8px 10px, var(--paper-dark) 6px, transparent 7px);
    background-size: 16px 10px;
    background-repeat: repeat-x;
  }
  .receipt::after{
    content:"";
    position:absolute; left:0; right:0; bottom:-10px; height:10px;
    background-image: radial-gradient(circle at 8px 0px, var(--paper-dark) 6px, transparent 7px);
    background-size: 16px 10px;
    background-repeat: repeat-x;
  }
  .receipt-head{
    text-align:center;
    padding-bottom: 14px;
    border-bottom: 1px dashed var(--dotted);
  }
  .receipt-head .store{
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .receipt-head .sub{
    font-size: 10.5px;
    color: var(--ink-soft);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .receipt-head .date{
    font-size: 10.5px;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  /* Scan control */
  .scan-zone{
    margin: 18px 0 8px;
  }
  #reader{
    width:100%;
    border-radius: 2px;
    overflow:hidden;
    display:none;
    border: 2px solid var(--ink);
    position:relative;
  }
  #reader.active{ display:block; }
  .scan-btn{
    width:100%;
    padding: 14px 10px;
    background: var(--ink);
    color: var(--white);
    border:none;
    font-family:inherit;
    font-size: 13px;
    font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
  }
  .scan-btn:active{ background: #33453B; }
  .scan-btn .dot{
    width:8px;height:8px;border-radius:50%;
    background: var(--scan);
  }
  .scan-btn.scanning .dot{
    animation: pulse 1s infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:0.35; transform:scale(0.7); }
  }
  .manual-link{
    text-align:center;
    margin-top:10px;
    font-size:11px;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor:pointer;
    letter-spacing:0.03em;
  }

  .status-line{
    text-align:center;
    font-size: 11.5px;
    color: var(--scan);
    min-height: 18px;
    margin-top:10px;
    letter-spacing:0.02em;
  }

  /* Item list styled as receipt lines */
  .items{
    margin-top: 18px;
    border-top: 1px dashed var(--dotted);
    padding-top: 12px;
  }
  .empty{
    text-align:center;
    color: var(--ink-soft);
    font-size: 12px;
    padding: 26px 10px;
    line-height:1.6;
  }
  .item-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 9px 0;
    border-bottom: 1px dotted var(--dotted);
    animation: feed 0.35s ease;
  }
  @keyframes feed{
    from{ opacity:0; transform: translateY(-8px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .item-thumb{
    width:34px; height:34px;
    background: var(--paper-dark);
    border: 1px solid var(--dotted);
    flex-shrink:0;
    object-fit: cover;
  }
  .item-thumb.placeholder{
    display:flex; align-items:center; justify-content:center;
    font-size: 14px; color: var(--ink-soft);
  }
  .item-info{
    flex:1;
    min-width:0;
  }
  .item-name{
    font-size: 12.5px;
    font-weight:600;
    line-height:1.25;
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }
  .item-brand{
    font-size: 10px;
    color: var(--ink-soft);
    margin-top:1px;
  }
  .item-qty{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
  }
  .qty-btn{
    width:20px;height:20px;
    border:1px solid var(--ink);
    background:none;
    font-family:inherit;
    font-size:12px;
    line-height:1;
    cursor:pointer;
    color:var(--ink);
  }
  .qty-btn:active{ background: var(--ink); color:var(--white); }
  .qty-val{
    min-width: 14px;
    text-align:center;
    font-weight:700;
  }
  .del-btn{
    background:none;border:none;
    color: var(--scan);
    font-size: 15px;
    cursor:pointer;
    padding: 2px 4px;
    line-height:1;
  }

  .totals{
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--ink);
    display:flex;
    justify-content:space-between;
    font-size: 12.5px;
    font-weight:700;
    letter-spacing:0.04em;
  }
  .export-btn{
    width:100%;
    margin-top: 14px;
    padding: 12px 10px;
    background: var(--white);
    color: var(--ink);
    border: 1.5px solid var(--ink);
    font-family:inherit;
    font-size: 12px;
    font-weight:700;
    letter-spacing:0.1em;
    text-transform:uppercase;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .export-btn:active{ background: var(--ink); color: var(--white); }
  .foot-msg{
    text-align:center;
    font-size:10px;
    color:var(--ink-soft);
    margin-top:18px;
    letter-spacing:0.08em;
  }

  /* Manual add modal */
  .modal-back{
    position:fixed; inset:0;
    background: rgba(31,42,36,0.55);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 20;
  }
  .modal-back.open{ display:flex; }
  .modal{
    background: var(--white);
    width:100%;
    max-width: 360px;
    padding: 20px;
    border: 2px solid var(--ink);
  }
  .modal h3{
    margin:0 0 14px;
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
  }
  .modal input{
    width:100%;
    font-family:inherit;
    font-size:13px;
    padding:10px;
    border:1px solid var(--dotted);
    background: var(--paper);
    margin-bottom:10px;
  }
  .modal-actions{
    display:flex;
    gap:8px;
    margin-top:6px;
  }
  .modal-actions button{
    flex:1;
    padding:10px;
    font-family:inherit;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.06em;
    text-transform:uppercase;
    border:1px solid var(--ink);
    background: var(--white);
    cursor:pointer;
  }
  .modal-actions .primary{
    background: var(--ink);
    color: var(--white);
  }
</style>
</head>
<body>

<div class="app">
  <div class="brandbar">
    <div class="mark">SPESA<b>·</b>SCAN</div>
    <div class="count" id="topCount">0 articoli</div>
  </div>

  <div class="receipt">
    <div class="receipt-head">
      <div class="store">La Mia Dispensa</div>
      <div class="sub">Inventario da scontrino</div>
      <div class="date" id="dateLine"></div>
    </div>

    <div class="scan-zone">
      <div id="reader"></div>
      <button class="scan-btn" id="scanToggle">
        <span class="dot"></span>
        <span id="scanLabel">Scansiona prodotto</span>
      </button>
      <div class="manual-link" id="manualLink">+ aggiungi manualmente</div>
      <div class="status-line" id="statusLine"></div>
    </div>

    <div class="items" id="itemsWrap">
      <div class="empty" id="emptyMsg">Ancora nessun prodotto scansionato.<br>Torna dalla spesa e inizia a scansionare.</div>
    </div>

    <div class="totals" id="totalsRow" style="display:none;">
      <span>Totale articoli</span>
      <span id="totalQty">0</span>
    </div>

    <button class="export-btn" id="exportBtn" style="display:none;">
      <span>⇪</span><span>Esporta / Invia lista</span>
    </button>
  </div>

  <div class="foot-msg">DATI SALVATI SU QUESTO DISPOSITIVO · PRODOTTI VIA OPENFOODFACTS</div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal">
    <h3>Aggiungi manualmente</h3>
    <input type="text" id="manualName" placeholder="Nome prodotto">
    <input type="text" id="manualBrand" placeholder="Marca (opzionale)">
    <div class="modal-actions">
      <button id="manualCancel">Annulla</button>
      <button class="primary" id="manualSave">Aggiungi</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'inventory';
let inventory = []; // [{barcode, name, brand, image, qty, addedAt}]
let html5Qr = null;
let scanning = false;
let processingLookup = false;

// Debounce: the camera reports the same barcode ~10x/second while it stays in
// view. Track the last accepted code and when we last saw it, and ignore an
// identical code until it has left the frame for RESCAN_COOLDOWN ms — so one
// physical scan = one item, but re-presenting the box still adds another unit.
let lastCode = null;
let lastCodeTime = 0;
const RESCAN_COOLDOWN = 2500;

// Short confirmation beep on acquisition. AudioContext must be created/resumed
// from a user gesture (the "Scansiona" tap), or mobile browsers keep it muted.
let audioCtx = null;
function initAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
}
function beep(){
  if(!audioCtx) return;
  try{
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.16);
  }catch(e){}
}

const itemsWrap = document.getElementById('itemsWrap');
const emptyMsg = document.getElementById('emptyMsg');
const topCount = document.getElementById('topCount');
const totalsRow = document.getElementById('totalsRow');
const totalQty = document.getElementById('totalQty');
const statusLine = document.getElementById('statusLine');
const scanToggle = document.getElementById('scanToggle');
const scanLabel = document.getElementById('scanLabel');
const readerDiv = document.getElementById('reader');
const exportBtn = document.getElementById('exportBtn');

document.getElementById('dateLine').textContent = new Date().toLocaleDateString('it-IT', {
  weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
});

function loadInventory(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    inventory = raw ? JSON.parse(raw) : [];
  }catch(e){
    inventory = [];
  }
  render();
}

function saveInventory(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(inventory));
  }catch(e){
    console.error('Storage error', e);
    setStatus('Errore nel salvataggio', true);
  }
}

function setStatus(msg, isError){
  statusLine.textContent = msg || '';
  statusLine.style.color = isError ? 'var(--scan)' : 'var(--grocery)';
}

function render(){
  itemsWrap.innerHTML = '';
  if(inventory.length === 0){
    itemsWrap.appendChild(emptyMsg);
    totalsRow.style.display = 'none';
    exportBtn.style.display = 'none';
    topCount.textContent = '0 articoli';
    return;
  }
  let totalItems = 0;
  inventory.forEach((item, idx) => {
    totalItems += item.qty;
    const row = document.createElement('div');
    row.className = 'item-row';

    const thumb = document.createElement(item.image ? 'img' : 'div');
    thumb.className = 'item-thumb' + (item.image ? '' : ' placeholder');
    if(item.image){
      thumb.src = item.image;
      thumb.alt = item.name;
    } else {
      thumb.textContent = '·';
    }

    const info = document.createElement('div');
    info.className = 'item-info';
    info.innerHTML = `<div class="item-name">${escapeHtml(item.name)}</div><div class="item-brand">${escapeHtml(item.brand || item.barcode)}</div>`;

    const qtyBox = document.createElement('div');
    qtyBox.className = 'item-qty';
    qtyBox.innerHTML = `
      <button class="qty-btn" data-act="dec" data-idx="${idx}">−</button>
      <span class="qty-val">${item.qty}</span>
      <button class="qty-btn" data-act="inc" data-idx="${idx}">+</button>
    `;

    const del = document.createElement('button');
    del.className = 'del-btn';
    del.textContent = '✕';
    del.dataset.act = 'del';
    del.dataset.idx = idx;

    row.appendChild(thumb);
    row.appendChild(info);
    row.appendChild(qtyBox);
    row.appendChild(del);
    itemsWrap.appendChild(row);
  });

  totalsRow.style.display = 'flex';
  exportBtn.style.display = 'flex';
  totalQty.textContent = totalItems;
  topCount.textContent = `${inventory.length} prodott${inventory.length===1?'o':'i'} · ${totalItems} pz`;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

itemsWrap.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const idx = parseInt(btn.dataset.idx, 10);
  const act = btn.dataset.act;
  if(act === 'inc'){ inventory[idx].qty += 1; }
  if(act === 'dec'){
    inventory[idx].qty -= 1;
    if(inventory[idx].qty <= 0){ inventory.splice(idx, 1); }
  }
  if(act === 'del'){ inventory.splice(idx, 1); }
  render();
  await saveInventory();
});

async function addProduct(barcode, name, brand, image){
  const existing = inventory.find(i => i.barcode === barcode || (barcode === 'manual' && i.name.toLowerCase() === name.toLowerCase()));
  if(existing){
    existing.qty += 1;
  } else {
    inventory.unshift({
      barcode: barcode,
      name: name,
      brand: brand || '',
      image: image || '',
      qty: 1,
      addedAt: new Date().toISOString()
    });
  }
  render();
  await saveInventory();
}

// Request only the fields we actually use — smaller, faster response
// (Open Food Facts recommends this) and less likely to time out on mobile.
const OFF_FIELDS = 'product_name,product_name_it,generic_name,brands,image_front_small_url,image_small_url';

async function fetchJson(url, ms){
  // Give up on a hung request so we can move on to the next proxy quickly.
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms || 12000);
  try{
    const res = await fetch(url, { signal: ctrl.signal });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  }finally{
    clearTimeout(timer);
  }
}

async function fetchProduct(code){
  const offUrl = `https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=${OFF_FIELDS}`;
  const enc = encodeURIComponent(offUrl);
  // Open Food Facts' API server does not send CORS headers to browsers, so a
  // direct fetch from a static page (GitHub Pages) is blocked. Try direct
  // first (fastest, most private when it works), then fall through a list of
  // public CORS proxies — any single one can be down, so we keep several.
  const endpoints = [
    offUrl,
    `https://corsproxy.io/?url=${enc}`,
    `https://api.codetabs.com/v1/proxy/?quest=${enc}`,
    `https://api.allorigins.win/raw?url=${enc}`
  ];
  let lastErr;
  for(const url of endpoints){
    try{
      const data = await fetchJson(url, 12000);
      // Make sure we got real OFF data, not a proxy error/HTML page.
      if(data && (typeof data.status !== 'undefined' || data.product)){
        return data;
      }
      throw new Error('Risposta non valida');
    }catch(e){
      lastErr = e;
    }
  }
  throw lastErr;
}

async function lookupBarcode(code, attempt){
  attempt = attempt || 1;
  if(processingLookup) return;
  processingLookup = true;
  setStatus(`Cerco ${code}...`, false);
  try{
    const data = await fetchProduct(code);
    if(data.status === 1 && data.product){
      const p = data.product;
      const name = p.product_name || p.product_name_it || p.generic_name || `Prodotto ${code}`;
      const brand = p.brands || '';
      const image = p.image_front_small_url || p.image_small_url || '';
      processingLookup = false;
      await addProduct(code, name, brand, image);
      setStatus(`✓ Aggiunto: ${name}`, false);
    } else {
      processingLookup = false;
      setStatus(`Non trovato (${code}) — aggiungilo manualmente`, true);
    }
  }catch(err){
    processingLookup = false;
    console.error('Lookup error', err);
    if(attempt < 2){
      // transient network hiccup — retry once automatically
      setTimeout(() => lookupBarcode(code, attempt + 1), 800);
      return;
    }
    // A TypeError ("Failed to fetch") means the request never reached the
    // server (network / CORS / blocked) — distinct from an HTTP error status.
    const isNetwork = (err instanceof TypeError);
    const msg = isNetwork
      ? 'Rete non raggiungibile (OpenFoodFacts bloccato?) — aggiungi manualmente'
      : `Errore: ${err.message} — riprova o aggiungi manualmente`;
    setStatus(msg, true);
  }
  setTimeout(() => setStatus(''), 4000);
}

function onScanSuccess(decodedText){
  const code = decodedText.trim();
  const now = Date.now();
  // Same box still in front of the camera: keep suppressing, and keep the
  // cooldown window alive so it only counts again once it has left the frame.
  if(code === lastCode && (now - lastCodeTime) < RESCAN_COOLDOWN){
    lastCodeTime = now;
    return;
  }
  if(processingLookup) return;
  lastCode = code;
  lastCodeTime = now;
  beep();
  if(navigator.vibrate) navigator.vibrate(80);
  lookupBarcode(code);
}

async function startScanning(){
  readerDiv.classList.add('active');
  html5Qr = new Html5Qrcode('reader', {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.EAN_13,
      Html5QrcodeSupportedFormats.EAN_8,
      Html5QrcodeSupportedFormats.UPC_A,
      Html5QrcodeSupportedFormats.UPC_E,
      Html5QrcodeSupportedFormats.CODE_128
    ],
    verbose: false
  });
  try{
    await html5Qr.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 260, height: 140 } },
      onScanSuccess,
      () => {}
    );
    scanning = true;
    scanToggle.classList.add('scanning');
    scanLabel.textContent = 'Ferma scansione';
  }catch(err){
    setStatus('Impossibile accedere alla fotocamera', true);
    readerDiv.classList.remove('active');
  }
}

async function stopScanning(){
  if(html5Qr && scanning){
    try{ await html5Qr.stop(); html5Qr.clear(); }catch(e){}
  }
  scanning = false;
  readerDiv.classList.remove('active');
  scanToggle.classList.remove('scanning');
  scanLabel.textContent = 'Scansiona prodotto';
}

scanToggle.addEventListener('click', () => {
  initAudio(); // unlock/resume audio while we have a user gesture
  if(scanning){ stopScanning(); } else { startScanning(); }
});

// Manual add modal
const modalBack = document.getElementById('modalBack');
document.getElementById('manualLink').addEventListener('click', () => {
  modalBack.classList.add('open');
  document.getElementById('manualName').value = '';
  document.getElementById('manualBrand').value = '';
  document.getElementById('manualName').focus();
});
document.getElementById('manualCancel').addEventListener('click', () => {
  modalBack.classList.remove('open');
});
document.getElementById('manualSave').addEventListener('click', async () => {
  const name = document.getElementById('manualName').value.trim();
  const brand = document.getElementById('manualBrand').value.trim();
  if(!name) return;
  await addProduct('manual-' + Date.now(), name, brand, '');
  modalBack.classList.remove('open');
});

// --- Export / send the list ---------------------------------------------
// The rich product data lives in the user's local Open Food Facts + Postgres
// setup, keyed by barcode. So we only need to hand off barcode + qty (name and
// brand are included for human readability). CSV is both easy to read in a
// WhatsApp/email message and trivial for a script to parse.
function csvField(v){
  v = (v == null ? '' : String(v));
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

function buildExportText(){
  const date = new Date().toISOString().slice(0, 10);
  const lines = ['barcode,qty,name,brand'];
  inventory.forEach(i => {
    lines.push([csvField(i.barcode), i.qty, csvField(i.name), csvField(i.brand)].join(','));
  });
  return { date, text: `Spesa ${date}\n` + lines.join('\n') };
}

function downloadFile(filename, content){
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function exportList(){
  if(inventory.length === 0){ setStatus('Lista vuota', true); return; }
  const { date, text } = buildExportText();
  // Native share sheet (WhatsApp, Gmail, ...) — best experience on mobile.
  if(navigator.share){
    try{
      await navigator.share({ title: `Spesa ${date}`, text });
      setStatus('Lista inviata', false);
      return;
    }catch(e){
      if(e && e.name === 'AbortError') return; // user closed the sheet
    }
  }
  // Fallback (desktop / no share sheet): copy to clipboard + download a file.
  try{
    await navigator.clipboard.writeText(text);
    setStatus('Lista copiata negli appunti', false);
  }catch(e){}
  downloadFile(`spesa-${date}.csv`, text);
}

exportBtn.addEventListener('click', exportList);

loadInventory();
</script>
</body>
</html>
